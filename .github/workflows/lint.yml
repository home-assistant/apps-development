name: Lint

env:
  SHELLCHECK_OPTS: -e SC1008 -s bash

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    name: hadolint
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run linter
        uses: hadolint/hadolint-action@v3.5.0
        with:
          config: .hadolint.yaml
          recursive: true
  jq:
    runs-on: ubuntu-latest
    name: JQ
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run linter
        run: |
          shopt -s globstar
          cat **/*.json | jq '.'
  shellcheck:
    runs-on: ubuntu-latest
    name: ShellCheck
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run linter
        uses: ludeeus/action-shellcheck@2.0.0
